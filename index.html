<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>入構前チェック</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      padding: 24px;
      background: #f7f7f7;
      color: #222;
    }
    .card {
      max-width: 520px;
      margin: 40px auto;
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
    }
    p {
      line-height: 1.7;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 18px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      background: #a62d2d;
      color: white;
      margin-top: 20px;
    }
    .note {
      font-size: 14px;
      color: #666;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>入構前チェックフォーム</h1>

    <p>
      今日の日付入りでGoogleフォームを開きます。<br>
      内容を確認して、最後はGoogleフォーム本体の送信ボタンを押してください。
    </p>

    <button onclick="openForm()">フォームを開く</button>

    <p class="note">
      ※PC持ち込みの有無は、フォーム画面で毎回選択してください。<br>
      ※第三者確認が未実施の場合は、フォーム上で修正してください。
    </p>
  </div>

  <script>
    function openForm() {
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth() + 1;
      const day = today.getDate();

      const baseUrl = "https://docs.google.com/forms/d/e/1FAIpQLSdkRdK3qjWWK3vrOu93EZA6RN3WelxdWQwalVMWUPkObPRPxg/viewform";

      const params = new URLSearchParams();

      params.append("usp", "pp_url");

      // 入場年月日
      params.append("entry.269098431_year", year);
      params.append("entry.269098431_month", month);
      params.append("entry.269098431_day", day);

      // 氏名
      params.append("entry.1095614385", "鈴木俊治");

      // 所属プロダクト
      params.append("entry.965370204", "Safety");

      // PC持ち込み時の注意事項
      params.append("entry.663985530", "了解しました。");

      // 持ち込み禁止物品確認
      params.append("entry.424483044", "USBメモリ");
      params.append("entry.424483044", "外付けHDD/SSD・SDカード・CD等記憶メディア");
      params.append("entry.424483044", "カメラ・録音機器・タブレット端末");
      params.append("entry.424483044", "Wi-fiルータ（モバイルルータ）");

      // 第三者確認
      params.append("entry.14770255", "実施済み");

      // 第三者確認者
      params.append("entry.1446194288", "kmt栗林");

      const url = baseUrl + "?" + params.toString();

      window.location.href = url;
    }
  </script>
</body>
</html>
